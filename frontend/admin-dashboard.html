<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Eventix</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="admin-dashboard.html" class="navbar-brand">⚡ <span>Eventix</span> <span class="badge badge-approved" style="font-size:0.7rem; margin-left:8px;">ADMIN</span></a>
      <div class="navbar-links">
        <a href="events.html">Preview Events</a>
        <button onclick="localStorage.clear(); window.location.href='login.html'" class="btn btn-danger btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <div class="main-content">
    <div class="page-header">
      <div class="page-header-glow"></div>
      <div class="container">
        <h1>🛡️ Admin <span class="highlight">Portal</span></h1>
        <p>Review and approve pending club organizers</p>
      </div>
    </div>

    <div class="container" style="max-width: 960px; padding-bottom: 80px;">
      <div class="admin-grid" style="grid-template-columns: 1fr; max-width: 500px; margin: 0 auto;">
        <!-- Approve Organizers -->
        <div class="admin-card fade-in stagger-1" onclick="window.location.href='admin-approve-organizers.html'" style="cursor:pointer;">
          <div class="card-icon">🏢</div>
          <h3>Approve Organizers</h3>
          <p>Review and approve new club accounts that have requested organizer access.</p>
          <button class="btn btn-outline-green btn-block">Review Organizers →</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    gsap.from(".page-header h1", { opacity: 0, y: 30, duration: 0.7, ease: "power3.out" });
    gsap.from(".page-header p", { opacity: 0, y: 20, duration: 0.6, delay: 0.15, ease: "power3.out" });
    gsap.from(".admin-card", { opacity: 0, y: 50, duration: 0.7, stagger: 0.12, ease: "power3.out", delay: 0.3 });
  </script>
</body>
</html>
