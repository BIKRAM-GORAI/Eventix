<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Approvals — EventHub Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="admin-dashboard.html" class="navbar-brand">⚡ Event<span>Hub</span> <span class="badge badge-approved" style="font-size:0.7rem; margin-left:8px;">ADMIN</span></a>
      <div class="navbar-links">
        <a href="admin-dashboard.html">← Dashboard</a>
      </div>
    </div>
  </nav>

  <div class="main-content">
    <div class="page-header">
      <div class="page-header-glow"></div>
      <div class="container">
        <h1>Pending <span class="highlight">Approvals</span></h1>
        <p>Review and approve student registrations</p>
      </div>
    </div>

    <div class="container" style="max-width: 800px; padding-bottom: 80px;">
      <div id="approvalList">
        <div class="empty-state">
          <div class="empty-icon">⏳</div>
          <p>Loading pending registrations...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    gsap.from(".page-header h1", { opacity: 0, y: 30, duration: 0.7, ease: "power3.out" });

    async function loadPending() {
      try {
        const res = await fetch("http://localhost:5000/api/registration/all");
        const registrations = await res.json();
        const container = document.getElementById("approvalList");

        if (!Array.isArray(registrations)) {
          container.innerHTML = `<div class="notice" style="background: rgba(255,68,68,0.08); border: 1px solid rgba(255,68,68,0.2); color: var(--red-accent);">${registrations.message || "Invalid data format"}</div>`;
          return;
        }

        const pending = registrations.filter(r =>
          r.approvalStatus &&
          r.approvalStatus.toUpperCase() === "PENDING" &&
          r.eventId !== null &&
          r.userId !== null
        );

        if (pending.length === 0) {
          container.innerHTML = `<div class="empty-state">
            <div class="empty-icon">✅</div>
            <p>All caught up! No pending approvals.</p>
          </div>`;
          return;
        }

        container.innerHTML = "";

        pending.forEach((reg, i) => {
          const user = reg.userId;
          const isTeam = !!reg.teamId;

          // Build student details
          let detailsHTML = "";
          if (user) {
            detailsHTML = `
              <div class="student-details" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; padding: 14px 16px; background: rgba(255,255,255,0.02); border: 1px solid var(--border-color); border-radius: var(--radius-sm); margin: 12px 0;">
                <div class="detail-item">
                  <div class="detail-label" style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase;">Name</div>
                  <div class="detail-value" style="font-weight: 500;">${user.name || "—"}</div>
                </div>
                <div class="detail-item">
                  <div class="detail-label" style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase;">Email</div>
                  <div class="detail-value" style="font-weight: 500;">${user.email || "—"}</div>
                </div>
                <div class="detail-item">
                  <div class="detail-label" style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase;">Phone</div>
                  <div class="detail-value" style="font-weight: 500;">${user.phone || "—"}</div>
                </div>
                <div class="detail-item">
                  <div class="detail-label" style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase;">Department</div>
                  <div class="detail-value" style="font-weight: 500;">${user.dept || "—"}</div>
                </div>
                <div class="detail-item">
                  <div class="detail-label" style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase;">Roll No</div>
                  <div class="detail-value" style="font-weight: 500;">${user.rollNo || "—"}</div>
                </div>
                <div class="detail-item">
                  <div class="detail-label" style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase;">College ID</div>
                  <div class="detail-value" style="font-weight: 500;">${user.collegeId || "—"}</div>
                </div>
                <div class="detail-item">
                  <div class="detail-label" style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase;">Year</div>
                  <div class="detail-value" style="font-weight: 500;">${user.studyingYear ? "Year " + user.studyingYear : "—"}</div>
                </div>
              </div>
            `;
          }

          // Team members
          let teamHTML = "";
          if (isTeam && reg.teamId && reg.teamId.members) {
            teamHTML = `<div style="margin: 8px 0;">
              <div style="font-size:0.85rem; color:var(--purple-accent); font-weight:600; margin-bottom:6px;">
                👥 Team: ${reg.teamId.teamName || "Unnamed"} (${reg.teamId.members.length} members)
              </div>
              ${reg.teamId.members.map(m => `
                <div class="team-member-card" style="padding: 10px 14px; background: rgba(139,92,246,0.04); border: 1px solid rgba(139,92,246,0.12); border-radius: var(--radius-sm); margin-bottom: 6px;">
                  <div class="member-name" style="font-weight: 600; font-size: 0.9rem;">${m.name}</div>
                  <div class="member-detail" style="font-size: 0.8rem; color: var(--text-muted);">${m.email} · ${m.dept || ""} · ${m.rollNo || ""} · ${m.collegeId || ""}</div>
                </div>
              `).join("")}
            </div>`;
          }
          const eventTitle = reg.eventId ? reg.eventId.title : "Deleted Event";

          const div = document.createElement("div");
          div.className = "approval-item";
          div.style.opacity = "0";
          div.style.transform = "translateY(20px)";

          div.innerHTML = `
            <div class="approval-info" style="flex:1;">
              <div style="display:flex; gap:8px; margin-bottom:8px;">
                ${isTeam ? `<span class="badge badge-team">👥 Team</span>` : `<span class="badge badge-solo">👤 Solo</span>`}
                <span class="badge badge-pending">⏳ Pending</span>
              </div>
              <h3 style="font-family:var(--font-display); margin-bottom:4px;">${eventTitle}</h3>
              ${detailsHTML}
              ${teamHTML}
            </div>
            <div style="display:flex; gap:8px; align-self: flex-start;">
              <button onclick="approve('${reg._id}', this)" class="btn btn-primary btn-sm">Approve ✓</button>
            </div>
          `;
          container.appendChild(div);

          gsap.to(div, { opacity: 1, y: 0, duration: 0.5, delay: i * 0.08, ease: "power3.out" });
        });

      } catch (err) {
        console.error("Fetch Error:", err);
        document.getElementById("approvalList").innerHTML = `<div class="empty-state">
          <div class="empty-icon">⚠️</div>
          <p>Error connecting to server. Is the backend running?</p>
        </div>`;
      }
    }

    async function approve(regId, btn) {
      if (!confirm("Approve this registration? The student will be able to download their QR ticket.")) return;

      btn.textContent = "⏳";
      btn.disabled = true;

      try {
        const res = await fetch(`http://localhost:5000/api/registration/approve/${regId}`, {
          method: "PUT",
        });

        if (res.ok) {
          btn.closest(".approval-item").style.transition = "all 0.4s ease";
          btn.closest(".approval-item").style.opacity = "0";
          btn.closest(".approval-item").style.transform = "translateX(40px)";
          setTimeout(() => {
            btn.closest(".approval-item").remove();
            // Check if list is now empty
            const remaining = document.querySelectorAll(".approval-item");
            if (remaining.length === 0) {
              document.getElementById("approvalList").innerHTML = `<div class="empty-state">
                <div class="empty-icon">✅</div>
                <p>All caught up! No pending approvals.</p>
              </div>`;
            }
          }, 400);
        } else {
          const data = await res.json();
          alert("Error: " + data.message);
          btn.textContent = "Approve ✓";
          btn.disabled = false;
        }
      } catch (err) {
        alert("Server error during approval process.");
        btn.textContent = "Approve ✓";
        btn.disabled = false;
      }
    }

    loadPending();
  </script>
</body>
</html>
