<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — EventHub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-glow"></div>
    <div class="auth-card fade-in">
      <div style="text-align:center; margin-bottom: 24px;">
        <a href="index.html" class="navbar-brand" style="justify-content:center; font-size:1.6rem;">⚡ Event<span>Hub</span></a>
      </div>
      <h2>Create Account</h2>
      <p class="subtitle">Join the campus events community</p>

      <form id="signupForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" class="form-input" placeholder="Your full name" name="name" id="name" required>
        </div>

        <div class="form-group">
          <label for="signupEmail">Email Address</label>
          <input type="email" class="form-input" placeholder="you@college.edu" name="email" id="signupEmail" required>
        </div>

        <div class="form-group">
          <label for="signupPass">Password</label>
          <input type="password" class="form-input" placeholder="Create a strong password" name="password" id="signupPass" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="college">College</label>
            <input type="text" class="form-input" placeholder="College name" name="collegeName" id="college" required>
          </div>
          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" class="form-input" placeholder="Phone number" name="phone" id="phone" required>
          </div>
        </div>

        <!-- <div class="form-group">
          <label for="photo">Profile Photo <span style="color: var(--text-muted);">(optional)</span></label>
          <input type="file" class="form-input" name="profilePhoto" id="photo" style="padding: 10px;">
        </div> -->

        <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account →</button>
      </form>

      <p id="msg" class="msg"></p>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    gsap.from(".auth-card", { opacity: 0, y: 40, duration: 0.8, ease: "power3.out" });

    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      const formData = new FormData(e.target);
      const btn = e.target.querySelector("button[type=submit]");

      btn.textContent = "Creating account...";
      btn.disabled = true;

      try {
        const res = await fetch("http://localhost:5000/api/auth/signup", {
          method: "POST",
          body: formData
        });

        let data;
        const contentType = res.headers.get("content-type");
        if (contentType && contentType.includes("application/json")) {
          data = await res.json();
        } else {
          const text = await res.text();
          console.error("Non-JSON response:", text);
          data = { message: "Server returned an unexpected response" };
        }

        if (res.ok && data.userId) {
          localStorage.setItem("pendingUserId", data.userId);
          window.location.href = "verify.html";
        } else {
          msg.innerText = data.message || "Signup failed";
          msg.className = "msg msg-error";
          btn.textContent = "Create Account →";
          btn.disabled = false;
        }
      } catch (error) {
        console.error("Signup error:", error);
        msg.innerText = "Error connecting to server. Is the backend running on port 5000?";
        msg.className = "msg msg-error";
        btn.textContent = "Create Account →";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
