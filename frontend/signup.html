<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Sign Up — EventHub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-glow"></div>
    <div class="auth-card fade-in" style="max-width: 520px;">
      <div style="text-align:center; margin-bottom: 24px;">
        <a href="index.html" class="navbar-brand" style="justify-content:center; font-size:1.6rem;">⚡ Event<span>Hub</span></a>
      </div>
      <div style="display:flex; justify-content:center; margin-bottom:16px;">
        <span class="badge badge-solo" style="font-size:0.85rem; padding:6px 16px;">🎓 Student Signup</span>
      </div>
      <h2>Create Account</h2>
      <p class="subtitle">Join the campus events community</p>

      <form id="signupForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" class="form-input" placeholder="Your full name" name="name" id="name" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="dept">Department</label>
            <input type="text" class="form-input" placeholder="e.g. CSE, ECE" name="dept" id="dept" required>
          </div>
          <div class="form-group">
            <label for="rollNo">Roll Number</label>
            <input type="text" class="form-input" placeholder="e.g. 21CS101" name="rollNo" id="rollNo" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="collegeId">College ID</label>
            <input type="text" class="form-input" placeholder="Your college ID" name="collegeId" id="collegeId" required>
          </div>
          <div class="form-group">
            <label for="studyingYear">Studying Year</label>
            <select class="form-input" name="studyingYear" id="studyingYear" required>
              <option value="">Select year</option>
              <option value="1">1st Year</option>
              <option value="2">2nd Year</option>
              <option value="3">3rd Year</option>
              <option value="4">4th Year</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="signupEmail">Email Address</label>
          <input type="email" class="form-input" placeholder="you@college.edu" name="email" id="signupEmail" required>
        </div>

        <div class="form-group">
          <label for="signupPass">Password</label>
          <input type="password" class="form-input" placeholder="Create a strong password" name="password" id="signupPass" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="text" class="form-input" placeholder="Your phone number" name="phone" id="phone" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account →</button>
      </form>

      <p id="msg" class="msg"></p>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Login</a> · <a href="signup-organizer.html">Organizer Signup</a>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    gsap.from(".auth-card", { opacity: 0, y: 40, duration: 0.8, ease: "power3.out" });

    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      const btn = e.target.querySelector("button[type=submit]");

      btn.textContent = "Creating account...";
      btn.disabled = true;

      const formData = {
        name: document.getElementById("name").value,
        email: document.getElementById("signupEmail").value,
        password: document.getElementById("signupPass").value,
        phone: document.getElementById("phone").value,
        dept: document.getElementById("dept").value,
        rollNo: document.getElementById("rollNo").value,
        collegeId: document.getElementById("collegeId").value,
        studyingYear: document.getElementById("studyingYear").value,
      };

      try {
        const res = await fetch("http://localhost:5000/api/auth/signup/student", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(formData),
        });

        const data = await res.json();

        if (res.ok && data.userId) {
          localStorage.setItem("pendingUserId", data.userId);
          localStorage.setItem("pendingRole", "student");
          window.location.href = "verify.html";
        } else {
          msg.innerText = data.message || "Signup failed";
          msg.className = "msg msg-error";
          btn.textContent = "Create Account →";
          btn.disabled = false;
        }
      } catch (error) {
        console.error("Signup error:", error);
        msg.innerText = "Error connecting to server. Is the backend running?";
        msg.className = "msg msg-error";
        btn.textContent = "Create Account →";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
