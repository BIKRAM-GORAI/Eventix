<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner — Eventix</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-brand">⚡ <span>Eventix</span></a>
      <div class="navbar-links">
        <a href="admin-dashboard.html">← Dashboard</a>
      </div>
    </div>
  </nav>

  <div class="main-content">
    <div class="container">
      <div class="scanner-wrapper">
        <h2 style="font-family: var(--font-display); text-align:center; margin-bottom: 24px;">Scan QR Code</h2>
        <div class="scanner-frame">
          <div id="reader" style="width:100%;"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function onScanSuccess(decodedText) {
      console.log("Scanned:", decodedText);
      fetch("http://localhost:5000/api/attendance/scan", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ registrationId: decodedText }),
      })
      .then(res => res.json())
      .then(data => alert(data.message))
      .catch(err => console.log(err));
    }

    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      onScanSuccess
    );
  </script>
</body>
</html>
