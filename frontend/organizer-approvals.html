<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Approvals — EventHub Organizer</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .student-details {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px;
      padding: 14px 16px; background: var(--bg-secondary);
      border: 1px solid var(--border-color); border-radius: var(--radius-sm);
      margin: 12px 0;
    }
    .student-details .detail-item {
      font-size: 0.85rem;
    }
    .student-details .detail-label {
      color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .student-details .detail-value {
      color: var(--text-primary); font-weight: 500;
    }
    .team-member-card {
      padding: 10px 14px; background: rgba(139,92,246,0.04);
      border: 1px solid rgba(139,92,246,0.12); border-radius: var(--radius-sm);
      margin-bottom: 6px;
    }
    .team-member-card .member-name { font-weight: 600; font-size: 0.9rem; }
    .team-member-card .member-detail { font-size: 0.8rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="organizer-dashboard.html" class="navbar-brand">⚡ Event<span>Hub</span> <span class="badge badge-team" style="font-size:0.7rem; margin-left:8px;">ORGANIZER</span></a>
      <div class="navbar-links">
        <a href="organizer-dashboard.html">← Dashboard</a>
      </div>
    </div>
  </nav>

  <div class="main-content">
    <div class="page-header">
      <div class="page-header-glow"></div>
      <div class="container">
        <h1>Pending <span class="highlight">Approvals</span></h1>
        <p>Review student registrations for your events</p>
      </div>
    </div>

    <div class="container" style="max-width: 800px; padding-bottom: 80px;">
      <div id="approvalList">
        <div class="empty-state">
          <div class="empty-icon">⏳</div>
          <p>Loading registrations...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    const role = localStorage.getItem("role");
    const clubId = localStorage.getItem("clubId");

    if (role !== "organizer" || !clubId) {
      alert("Access denied.");
      window.location.href = "login-organizer.html";
    }

    gsap.from(".page-header h1", { opacity: 0, y: 30, duration: 0.7, ease: "power3.out" });

    async function loadPending() {
      try {
        // 1. Get events by this club
        const eventsRes = await fetch(`http://localhost:5000/api/events/club/${clubId}`);
        const events = await eventsRes.json();

        if (!Array.isArray(events) || events.length === 0) {
          document.getElementById("approvalList").innerHTML = `<div class="empty-state">
            <div class="empty-icon">📭</div>
            <p>No events found for your club. Create an event first!</p>
          </div>`;
          return;
        }

        // 2. Fetch registrations for each event
        let allPending = [];

        for (const event of events) {
          const regRes = await fetch(`http://localhost:5000/api/registration/event/${event._id}`);
          const regs = await regRes.json();
          if (Array.isArray(regs)) {
            const pending = regs.filter(r => r.approvalStatus === "PENDING");
            pending.forEach(r => { r._eventTitle = event.title; });
            allPending = allPending.concat(pending);
          }
        }

        const container = document.getElementById("approvalList");

        if (allPending.length === 0) {
          container.innerHTML = `<div class="empty-state">
            <div class="empty-icon">✅</div>
            <p>All caught up! No pending approvals.</p>
          </div>`;
          return;
        }

        container.innerHTML = "";

        allPending.forEach((reg, i) => {
          const user = reg.userId;
          const isTeam = !!reg.teamId;

          // Build student details
          let detailsHTML = "";
          if (user) {
            detailsHTML = `
              <div class="student-details">
                <div class="detail-item">
                  <div class="detail-label">Name</div>
                  <div class="detail-value">${user.name || "—"}</div>
                </div>
                <div class="detail-item">
                  <div class="detail-label">Email</div>
                  <div class="detail-value">${user.email || "—"}</div>
                </div>
                <div class="detail-item">
                  <div class="detail-label">Phone</div>
                  <div class="detail-value">${user.phone || "—"}</div>
                </div>
                <div class="detail-item">
                  <div class="detail-label">Department</div>
                  <div class="detail-value">${user.dept || "—"}</div>
                </div>
                <div class="detail-item">
                  <div class="detail-label">Roll No</div>
                  <div class="detail-value">${user.rollNo || "—"}</div>
                </div>
                <div class="detail-item">
                  <div class="detail-label">College ID</div>
                  <div class="detail-value">${user.collegeId || "—"}</div>
                </div>
                <div class="detail-item">
                  <div class="detail-label">Year</div>
                  <div class="detail-value">${user.studyingYear ? "Year " + user.studyingYear : "—"}</div>
                </div>
              </div>
            `;
          }

          // Team members
          let teamHTML = "";
          if (isTeam && reg.teamId && reg.teamId.members) {
            teamHTML = `<div style="margin: 8px 0;">
              <div style="font-size:0.85rem; color:var(--purple-accent); font-weight:600; margin-bottom:6px;">
                👥 Team: ${reg.teamId.teamName || "Unnamed"} (${reg.teamId.members.length} members)
              </div>
              ${reg.teamId.members.map(m => `
                <div class="team-member-card">
                  <div class="member-name">${m.name}</div>
                  <div class="member-detail">${m.email} · ${m.dept || ""} · ${m.rollNo || ""} · ${m.collegeId || ""}</div>
                </div>
              `).join("")}
            </div>`;
          }

          const div = document.createElement("div");
          div.className = "approval-item";
          div.style.opacity = "0";
          div.style.transform = "translateY(20px)";

          div.innerHTML = `
            <div style="flex:1;">
              <div style="display:flex; gap:8px; margin-bottom:8px;">
                ${isTeam
                  ? `<span class="badge badge-team">👥 Team</span>`
                  : `<span class="badge badge-solo">👤 Solo</span>`
                }
                <span class="badge badge-pending">⏳ Pending</span>
              </div>
              <h3 style="font-family:var(--font-display); margin-bottom:4px;">${reg._eventTitle || "Unknown Event"}</h3>
              ${detailsHTML}
              ${teamHTML}
            </div>
            <div style="display:flex; gap:8px; align-self: flex-start;">
              <button onclick="approve('${reg._id}', this)" class="btn btn-primary btn-sm">Approve ✓</button>
              <button onclick="reject('${reg._id}', this)" class="btn btn-danger btn-sm">Reject ✕</button>
            </div>
          `;
          container.appendChild(div);

          gsap.to(div, { opacity: 1, y: 0, duration: 0.5, delay: i * 0.08, ease: "power3.out" });
        });

      } catch (err) {
        console.error("Fetch Error:", err);
        document.getElementById("approvalList").innerHTML = `<div class="empty-state">
          <div class="empty-icon">⚠️</div>
          <p>Error loading registrations. Is the backend running?</p>
        </div>`;
      }
    }

    async function approve(regId, btn) {
      if (!confirm("Approve this registration? A ticket will be emailed to the student immediately.")) return;

      btn.textContent = "⏳";
      btn.disabled = true;

      try {
        const res = await fetch(`http://localhost:5000/api/organizer/approve/${regId}`, {
          method: "POST",
        });

        if (res.ok) {
          const item = btn.closest(".approval-item");
          item.style.transition = "all 0.4s ease";
          item.style.opacity = "0";
          item.style.transform = "translateX(40px)";
          setTimeout(() => {
            item.remove();
            if (document.querySelectorAll(".approval-item").length === 0) {
              document.getElementById("approvalList").innerHTML = `<div class="empty-state">
                <div class="empty-icon">✅</div>
                <p>All caught up! No pending approvals.</p>
              </div>`;
            }
          }, 400);
        } else {
          const data = await res.json();
          alert("Error: " + data.message);
          btn.textContent = "Approve ✓";
          btn.disabled = false;
        }
      } catch (err) {
        alert("Server error during approval.");
        btn.textContent = "Approve ✓";
        btn.disabled = false;
      }
    }

    async function reject(regId, btn) {
      if (!confirm("Reject this registration?")) return;

      btn.textContent = "⏳";
      btn.disabled = true;

      try {
        const res = await fetch(`http://localhost:5000/api/organizer/reject/${regId}`, {
          method: "POST",
        });

        if (res.ok) {
          const item = btn.closest(".approval-item");
          item.style.transition = "all 0.4s ease";
          item.style.opacity = "0";
          item.style.transform = "translateX(-40px)";
          setTimeout(() => {
            item.remove();
            if (document.querySelectorAll(".approval-item").length === 0) {
              document.getElementById("approvalList").innerHTML = `<div class="empty-state">
                <div class="empty-icon">✅</div>
                <p>All caught up! No pending approvals.</p>
              </div>`;
            }
          }, 400);
        } else {
          const data = await res.json();
          alert("Error: " + data.message);
          btn.textContent = "Reject ✕";
          btn.disabled = false;
        }
      } catch (err) {
        alert("Server error during rejection.");
        btn.textContent = "Reject ✕";
        btn.disabled = false;
      }
    }

    loadPending();
  </script>
</body>
</html>
