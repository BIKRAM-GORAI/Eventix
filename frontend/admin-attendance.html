<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Analytics — EventHub Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ── Analytics-specific styles ── */
    .analytics-bar {
      display: flex;
      gap: 20px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .analytics-stat {
      flex: 1;
      min-width: 180px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      text-align: center;
    }
    .analytics-stat .stat-value {
      font-family: var(--font-display);
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--green-primary);
    }
    .analytics-stat .stat-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* Event row in overview */
    .event-row {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: all var(--transition-base);
    }
    .event-row:hover {
      border-color: var(--green-border);
      transform: translateX(4px);
      box-shadow: var(--shadow-green);
    }
    .event-row-info { flex: 1; }
    .event-row-info h3 {
      font-family: var(--font-display);
      font-size: 1.1rem;
      margin-bottom: 4px;
    }
    .event-row-info .meta {
      font-size: 0.85rem;
      color: var(--text-secondary);
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .event-row-stats {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .mini-progress {
      width: 100px;
      height: 8px;
      background: var(--bg-input);
      border-radius: var(--radius-full);
      overflow: hidden;
    }
    .mini-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--green-dark), var(--green-primary));
      border-radius: var(--radius-full);
      transition: width 0.6s ease;
    }
    .attendance-pct {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--green-primary);
      min-width: 48px;
      text-align: right;
    }

    /* Detail View */
    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 32px;
      gap: 20px;
      flex-wrap: wrap;
    }
    .detail-header h2 {
      font-family: var(--font-display);
      font-size: 1.6rem;
    }

    .back-btn {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: var(--font-primary);
      font-size: 0.9rem;
      transition: all var(--transition-fast);
    }
    .back-btn:hover {
      border-color: var(--green-primary);
      color: var(--green-primary);
    }

    /* Team group box */
    .team-group {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .team-group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: linear-gradient(135deg, rgba(139,92,246,0.08) 0%, transparent 60%);
      border-bottom: 1px solid var(--border-color);
    }
    .team-group-header h4 {
      font-family: var(--font-display);
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .team-group-count {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    /* Person row */
    .person-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-color);
      transition: background var(--transition-fast);
    }
    .person-row:last-child { border-bottom: none; }
    .person-row:hover { background: rgba(255,255,255,0.02); }

    .person-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .person-name {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .person-email {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .person-college {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }
    .scan-time {
      font-size: 0.8rem;
      color: var(--green-primary);
      font-family: var(--font-display);
      text-align: right;
    }
    .scan-time .time-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-family: var(--font-primary);
    }

    /* Section title */
    .section-title {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="admin-dashboard.html" class="navbar-brand">⚡ Event<span>Hub</span> <span class="badge badge-approved" style="font-size:0.7rem; margin-left:8px;">ADMIN</span></a>
      <div class="navbar-links">
        <a href="admin-dashboard.html">← Dashboard</a>
      </div>
    </div>
  </nav>

  <div class="main-content">
    <div class="page-header">
      <div class="page-header-glow"></div>
      <div class="container">
        <h1>📊 Attendance <span class="highlight">Analytics</span></h1>
        <p>Real-time check-in data across all events</p>
      </div>
    </div>

    <div class="container" style="max-width: 900px; padding-bottom: 80px;">
      <!-- Overview View -->
      <div id="overviewView">
        <div class="analytics-bar" id="globalStats"></div>
        <div id="eventListContainer">
          <div class="empty-state">
            <div class="empty-icon">⏳</div>
            <p>Loading events...</p>
          </div>
        </div>
      </div>

      <!-- Detail View (hidden initially) -->
      <div id="detailView" style="display: none;">
        <div id="detailContent"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    gsap.from(".page-header h1", { opacity: 0, y: 30, duration: 0.7, ease: "power3.out" });

    // ── OVERVIEW: Load all events with attendance stats ──
    async function loadOverview() {
      try {
        const res = await fetch("http://localhost:5000/api/attendance/summary");
        const events = await res.json();

        if (!Array.isArray(events) || events.length === 0) {
          document.getElementById("eventListContainer").innerHTML =
            '<div class="empty-state"><div class="empty-icon">📭</div><p>No events found.</p></div>';
          document.getElementById("globalStats").innerHTML = "";
          return;
        }

        // Global stats
        const totalEvents = events.length;
        const totalCheckedIn = events.reduce((s, e) => s + e.totalCheckedIn, 0);
        const totalApproved = events.reduce((s, e) => s + e.totalApproved, 0);
        const avgRate = totalApproved > 0 ? Math.round((totalCheckedIn / totalApproved) * 100) : 0;

        document.getElementById("globalStats").innerHTML = `
          <div class="analytics-stat">
            <div class="stat-value">${totalEvents}</div>
            <div class="stat-label">Total Events</div>
          </div>
          <div class="analytics-stat">
            <div class="stat-value">${totalApproved}</div>
            <div class="stat-label">Approved Registrations</div>
          </div>
          <div class="analytics-stat">
            <div class="stat-value">${totalCheckedIn}</div>
            <div class="stat-label">Checked In</div>
          </div>
          <div class="analytics-stat">
            <div class="stat-value">${avgRate}%</div>
            <div class="stat-label">Avg Attendance</div>
          </div>
        `;

        // Event rows
        const container = document.getElementById("eventListContainer");
        container.innerHTML = "";

        events.forEach((event, i) => {
          const dateStr = new Date(event.date).toLocaleDateString("en-IN", {
            day: "numeric", month: "short", year: "numeric"
          });
          const catBadge = event.category && event.category !== "Other"
            ? `<span class="badge" style="background:rgba(139,92,246,0.1); border:1px solid rgba(139,92,246,0.2); color:var(--purple-accent); font-size:0.7rem;">${event.category}</span>`
            : "";
          const typeBadge = event.isTeamEvent
            ? '<span class="badge badge-team" style="font-size:0.7rem;">Team</span>'
            : '<span class="badge badge-solo" style="font-size:0.7rem;">Solo</span>';

          const row = document.createElement("div");
          row.className = "event-row";
          row.style.opacity = "0";
          row.onclick = () => loadEventDetail(event._id);

          row.innerHTML = `
            <div class="event-row-info">
              <div style="display:flex; gap:6px; margin-bottom:6px;">${catBadge} ${typeBadge}</div>
              <h3>${event.title}</h3>
              <div class="meta">
                <span>📅 ${dateStr}${event.startTime ? ' · ' + event.startTime : ''}</span>
                <span>📍 ${event.venue}</span>
                <span>🎟️ ${event.totalCheckedIn}/${event.totalApproved} checked in</span>
              </div>
            </div>
            <div class="event-row-stats">
              <div class="mini-progress">
                <div class="mini-progress-fill" style="width: ${event.attendanceRate}%;"></div>
              </div>
              <div class="attendance-pct">${event.attendanceRate}%</div>
            </div>
          `;

          container.appendChild(row);
          gsap.to(row, { opacity: 1, duration: 0.5, delay: i * 0.06, ease: "power3.out" });
        });

        // Animate stats
        gsap.from(".analytics-stat", { opacity: 0, y: 20, duration: 0.5, stagger: 0.08, ease: "power3.out" });

      } catch (err) {
        console.error(err);
        document.getElementById("eventListContainer").innerHTML =
          '<div class="empty-state"><div class="empty-icon">⚠️</div><p>Failed to load data. Is the backend running?</p></div>';
      }
    }


    // ── DETAIL: Load attendance for a specific event ──
    async function loadEventDetail(eventId) {
      try {
        const res = await fetch(`http://localhost:5000/api/attendance/event/${eventId}`);
        const data = await res.json();

        document.getElementById("overviewView").style.display = "none";
        document.getElementById("detailView").style.display = "block";

        const dateStr = new Date(data.event.date).toLocaleDateString("en-IN", {
          day: "numeric", month: "long", year: "numeric"
        });

        let html = `
          <div class="detail-header">
            <div>
              <button class="back-btn" onclick="goBack()">← Back to All Events</button>
              <h2 style="margin-top: 16px;">${data.event.title}</h2>
              <div style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 4px;">
                📅 ${dateStr}${data.event.startTime ? ' · ' + data.event.startTime : ''} &nbsp; 📍 ${data.event.venue}
              </div>
            </div>
          </div>

          <div class="analytics-bar">
            <div class="analytics-stat">
              <div class="stat-value">${data.stats.totalRegistrations}</div>
              <div class="stat-label">Registered</div>
            </div>
            <div class="analytics-stat">
              <div class="stat-value">${data.stats.totalCheckedIn}</div>
              <div class="stat-label">Checked In</div>
            </div>
            <div class="analytics-stat">
              <div class="stat-value" style="color: ${data.stats.attendanceRate >= 70 ? 'var(--green-primary)' : data.stats.attendanceRate >= 40 ? 'var(--orange-accent)' : 'var(--red-accent)'};">
                ${data.stats.attendanceRate}%
              </div>
              <div class="stat-label">Attendance Rate</div>
            </div>
          </div>
        `;

        // No check-ins yet
        if (data.stats.totalCheckedIn === 0) {
          html += `<div class="empty-state" style="padding: 40px;">
            <div class="empty-icon">📭</div>
            <p>No check-ins recorded yet for this event.</p>
          </div>`;
          document.getElementById("detailContent").innerHTML = html;
          gsap.from(".detail-header", { opacity: 0, y: 20, duration: 0.5, ease: "power3.out" });
          gsap.from(".analytics-stat", { opacity: 0, y: 20, duration: 0.4, stagger: 0.08, ease: "power3.out", delay: 0.15 });
          return;
        }

        // ── Team Groups ──
        if (data.teamGroups && data.teamGroups.length > 0) {
          html += `<div class="section-title">👥 Team Check-ins</div>`;

          data.teamGroups.forEach((team) => {
            html += `
              <div class="team-group">
                <div class="team-group-header">
                  <h4>🏷️ ${team.teamName}</h4>
                  <span class="team-group-count">${team.checkedIn.length}/${team.totalMembers} members scanned</span>
                </div>
                ${team.checkedIn.map(m => `
                  <div class="person-row">
                    <div class="person-info">
                      <span class="person-name">${m.name}</span>
                      <span class="person-email">${m.email}</span>
                      ${m.college ? `<span class="person-college">🏫 ${m.college}</span>` : ''}
                    </div>
                    <div class="scan-time">
                      <div class="time-label">Scanned at</div>
                      ${new Date(m.scannedAt).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: true })}
                    </div>
                  </div>
                `).join("")}
              </div>
            `;
          });
        }

        // ── Solo Attendees ──
        if (data.soloAttendees && data.soloAttendees.length > 0) {
          html += `<div class="section-title" style="margin-top: 24px;">👤 Solo Check-ins</div>`;
          html += `<div class="team-group">`;

          data.soloAttendees.forEach(m => {
            html += `
              <div class="person-row">
                <div class="person-info">
                  <span class="person-name">${m.name}</span>
                  <span class="person-email">${m.email}</span>
                  ${m.college ? `<span class="person-college">🏫 ${m.college}</span>` : ''}
                </div>
                <div class="scan-time">
                  <div class="time-label">Scanned at</div>
                  ${new Date(m.scannedAt).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: true })}
                </div>
              </div>
            `;
          });

          html += `</div>`;
        }

        document.getElementById("detailContent").innerHTML = html;

        // Animations
        gsap.from(".detail-header", { opacity: 0, y: 20, duration: 0.5, ease: "power3.out" });
        gsap.from(".analytics-stat", { opacity: 0, y: 20, duration: 0.4, stagger: 0.08, ease: "power3.out", delay: 0.15 });
        gsap.from(".team-group, .section-title", { opacity: 0, y: 30, duration: 0.5, stagger: 0.1, ease: "power3.out", delay: 0.3 });

      } catch (err) {
        console.error(err);
        document.getElementById("detailContent").innerHTML =
          '<div class="empty-state"><div class="empty-icon">⚠️</div><p>Failed to load attendance data.</p></div>';
      }
    }


    function goBack() {
      document.getElementById("detailView").style.display = "none";
      document.getElementById("overviewView").style.display = "block";
    }

    loadOverview();
  </script>
</body>
</html>
