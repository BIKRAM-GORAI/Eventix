<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Eventix</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-glow"></div>
    <div class="auth-card fade-in">
      <div style="text-align:center; margin-bottom: 24px;">
        <a href="index.html" class="navbar-brand" style="justify-content:center; font-size:1.6rem;">⚡ <span>Eventix</span></a>
      </div>
      <div style="display:flex; justify-content:center; margin-bottom:16px;">
        <span class="badge badge-approved" style="font-size:0.85rem; padding:6px 16px;">🛡️ Admin Login</span>
      </div>
      <h2>Admin Panel</h2>
      <p class="subtitle">System administration access</p>

      <div class="form-group">
        <label for="email">Admin Email</label>
        <input type="email" id="email" class="form-input" placeholder="admin@college.edu">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="Admin password">
      </div>

      <button onclick="login()" class="btn btn-primary btn-block btn-lg" id="loginBtn">Login as Admin →</button>

      <p id="msg" class="msg"></p>

      <div class="auth-footer">
        <a href="login.html">Student Login</a> · <a href="login-organizer.html">Organizer Login</a>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    gsap.from(".auth-card", { opacity: 0, y: 40, duration: 0.8, ease: "power3.out" });

    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const btn = document.getElementById("loginBtn");
      const msg = document.getElementById("msg");

      btn.textContent = "Logging in...";
      btn.disabled = true;

      try {
        const res = await fetch("http://localhost:5000/api/auth/login/admin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (res.ok && data.message.includes("Login successful")) {
          localStorage.setItem("userId", data.user._id);
          localStorage.setItem("role", "admin");
          localStorage.setItem("userName", data.user.name);
          window.location.href = "admin-dashboard.html";
        } else {
          msg.innerText = data.message || "Invalid admin credentials";
          msg.className = "msg msg-error";
          btn.textContent = "Login as Admin →";
          btn.disabled = false;
        }
      } catch (error) {
        msg.innerText = "Error connecting to server.";
        msg.className = "msg msg-error";
        btn.textContent = "Login as Admin →";
        btn.disabled = false;
      }
    }

    document.getElementById("password").addEventListener("keydown", (e) => {
      if (e.key === "Enter") login();
    });
  </script>
</body>
</html>
