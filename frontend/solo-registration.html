<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solo Registration — EventHub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-brand">⚡ Event<span>Hub</span></a>
      <div class="navbar-links">
        <a href="events.html">← Back to Events</a>
      </div>
    </div>
  </nav>

  <div class="main-content">
    <div class="container-sm" style="padding-top: 40px; padding-bottom: 80px;">
      <div class="auth-card fade-in" style="max-width: 100%;">
        <div style="text-align: center; margin-bottom: 24px;">
          <div style="font-size: 3rem; margin-bottom: 8px;">🎯</div>
          <h2>Confirm Registration</h2>
          <p class="subtitle">Review event details before registering</p>
        </div>

        <div id="eventSummary" class="reg-detail" style="margin-bottom: 24px;">
          <div class="empty-state" style="padding: 20px;">
            <p>Loading event details...</p>
          </div>
        </div>

        <div class="notice notice-info">
          <strong>Note:</strong> Your registration will be sent to the organizers for approval. Once approved, you'll receive your QR ticket via email.
        </div>

        <button id="regBtn" onclick="confirmRegistration()" class="btn btn-primary btn-block btn-lg">
          Confirm & Register →
        </button>

        <p id="msg" class="msg"></p>

        <div class="auth-footer">
          <a href="events.html">Cancel and go back</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    const userId = localStorage.getItem("userId");
    const eventId = localStorage.getItem("selectedEventId");
    if (!userId || !eventId) window.location.href = "events.html";

    gsap.from(".auth-card", { opacity: 0, y: 40, duration: 0.8, ease: "power3.out" });

    async function fetchEventDetails() {
      try {
        const res = await fetch(`http://localhost:5000/api/events/${eventId}`);
        const event = await res.json();

        if (res.ok) {
          document.getElementById("eventSummary").innerHTML = `
            <div class="reg-detail-row">
              <span class="label">Event</span>
              <span class="value">${event.title}</span>
            </div>
            <div class="reg-detail-row">
              <span class="label">Venue</span>
              <span class="value">${event.venue}</span>
            </div>
            <div class="reg-detail-row">
              <span class="label">Date</span>
              <span class="value">${new Date(event.date).toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" })}</span>
            </div>
            <div class="reg-detail-row">
              <span class="label">Fee</span>
              <span class="value" style="color: ${event.price > 0 ? 'var(--orange-accent)' : 'var(--green-primary)'};">${event.price > 0 ? `₹${event.price}` : "Free"}</span>
            </div>
            <div class="reg-detail-row">
              <span class="label">Type</span>
              <span class="value">Solo Entry</span>
            </div>
          `;
        }
      } catch (err) {
        console.error(err);
        document.getElementById("eventSummary").innerHTML = '<p style="color: var(--red-accent); text-align:center;">Failed to load event details</p>';
      }
    }

    async function confirmRegistration() {
      const btn = document.getElementById("regBtn");
      const msg = document.getElementById("msg");

      btn.disabled = true;
      btn.innerText = "⏳ Processing...";

      try {
        const res = await fetch("http://localhost:5000/api/registration/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId, eventId })
        });

        const data = await res.json();

        if (res.ok) {
          msg.innerText = "✅ Registration Successful!";
          msg.className = "msg msg-success";
          setTimeout(() => { window.location.href = "my-events.html"; }, 1500);
        } else {
          msg.innerText = data.message || "Registration failed.";
          msg.className = "msg msg-error";
          btn.disabled = false;
          btn.innerText = "Confirm & Register →";
        }
      } catch (err) {
        msg.innerText = "Error connecting to server.";
        msg.className = "msg msg-error";
        btn.disabled = false;
        btn.innerText = "Confirm & Register →";
      }
    }

    fetchEventDetails();
  </script>
</body>
</html>
